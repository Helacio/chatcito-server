server:
  port: 8080

spring:
  application:
    name: ws-chat

logging:
  level:
    com.chat: DEBUG
    org.springframework.web.socket: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ws-chat

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
